N('lean','The Lean Startup','Eric Ries','Business',2011,4.2,10,'Intermediate','Treat a new business as an experiment: build small, measure real behavior, and learn before you scale.','Students with a startup or project idea.','Readers who want deep finance or marketing detail.','Instead of spending months on a perfect product, build the smallest version that tests your biggest assumption. Measure how real people respond, then decide whether to keep going or change direction.',['Build, measure, learn|Run quick loops of making something, testing it and learning from the result.','Minimum viable product|Release the simplest version that can teach you something.','Validated learning|Count progress by what you have proven about customers, not by work done.','Pivot or persevere|Use evidence to decide whether to change course.'],['Write your riskiest assumption in one sentence.','Test it with five real people this week.','Record what you learned before building more.'],'The advice is shaped by tech startups and fits slower, regulated industries less well.','A clear mindset for any new project. Worth reading in full if you plan to build.'),
N('money','The Psychology of Money','Morgan Housel','Money & Finance',2020,4.5,10,'Beginner','How you behave with money matters more than how much you know about it.','Students starting to earn, save or invest.','Readers wanting step-by-step investing instructions.','Good financial outcomes come from habits like saving steadily, staying patient and avoiding panic, not from being the smartest. Know what is enough, expect surprises, and leave room for error.',['Behavior beats knowledge|Staying calm in a downturn matters more than picking clever investments.','Know what is enough|Chasing more without a limit leads to risks you did not need.','Time and compounding|Small amounts left alone for a long time grow surprisingly large.','Margin of safety|Plan for being wrong and keep savings as a buffer.'],['Set an automatic monthly saving, however small.','Write down what “enough” means for you.','Build an emergency buffer before taking risks.'],'It is a set of essays with few step-by-step methods, and examples lean on the US market.','Short, wise and readable. A strong first money book.'),
N('think','Thinking, Fast and Slow','Daniel Kahneman','Psychology',2011,4.4,15,'Advanced','Your mind has a fast, intuitive mode and a slow, careful one, and the fast one makes predictable mistakes.','Students who want to understand decision-making and bias.','Readers wanting a light read; the full book is long and dense.','We rely on quick gut judgments that are often useful but prone to systematic errors. Slow reasoning can correct them, but it takes effort, so we often skip it. Knowing the common traps helps you pause at the right moments.',['Two systems|Fast intuition runs automatically; slow reasoning needs effort and is easily lazy.','Anchoring|A first number you hear pulls your later estimates toward it.','Loss aversion|Losses feel stronger than equal gains, which skews choices.','Overconfidence|We judge by the evidence in front of us and ignore what we do not know.'],['Before big decisions, wait a day and write down your reasons.','Ask what information you are missing.','Compare with similar past cases, not just your own story.'],'Some famous studies discussed have since faced replication doubts, and the book is long.','Rewarding but demanding. The summary gives the core; read the book for depth.'),
N('friends','How to Win Friends and Influence People','Dale Carnegie','Communication',1936,4.3,5,'Beginner','Genuine interest in other people is the simplest route to better relationships and influence.','Students building social and networking skills.','Readers who dislike older, anecdote-driven advice.','People respond to being heard and appreciated. Avoid criticizing, show real interest, remember names, and let others talk about themselves. Persuade by seeing things from their point of view.',['Don’t criticize|Condemnation rarely changes people; it makes them defensive.','Appreciate sincerely|Honest recognition motivates more than flattery or pressure.','Be interested|Ask questions and listen more than you speak.','See their view|Frame requests around what the other person wants.'],['Give one specific, honest compliment today.','In your next conversation, ask two follow-up questions.','Replace one criticism with a question.'],'Written in 1936, its tone feels dated, and the tactics can seem manipulative if used insincerely.','Timeless basics. Quick to read and easy to practise.'),
N('why','Start With Why','Simon Sinek','Leadership',2009,4.0,5,'Beginner','People follow leaders and buy from organizations that begin with a clear purpose.','Student leaders, club organizers and future founders.','Readers who want detailed management methods.','Many groups explain what they do; inspiring ones explain why they exist. Starting with purpose builds trust and loyalty, and the how and what then follow from it.',['The Golden Circle|Think in layers: why, then how, then what.','Purpose attracts|People who share your belief stay committed.','Trust and culture|Lead and recruit for shared values, not just skills.','Consistency|Actions must match the stated purpose.'],['Write one sentence on why your team or project exists.','Check whether recent decisions fit it.','Share it with the people you work with.'],'Examples are selective and the central model is more inspiring than rigorously tested.','Good for thinking about purpose. Easy to skim.'),
N('clean','Clean Code','Robert C. Martin','Technology & AI',2008,4.4,10,'Intermediate','Code is read far more often than written, so write it for humans first.','Computer science students learning to write professional code.','Complete beginners still learning basic syntax.','Clear names, small focused functions and good tests make software easier to change. Messy code slows teams down. Leave the code cleaner than you found it.',['Meaningful names|A good name explains what something is and why it exists.','Small functions|Each function should do one thing well.','Tests protect change|Automated tests let you improve code without fear.','Leave it cleaner|Small, steady cleanups prevent decay.'],['Rename three unclear variables in a project.','Split one long function into smaller ones.','Add a test for code you are about to change.'],'Examples are in Java and some rules are applied dogmatically; modern teams adapt them.','A classic for programmers. Apply the ideas, not every rule.'),
N('sleep','Why We Sleep','Matthew Walker','Health & Wellness',2017,4.3,10,'Beginner','Sleep is essential for memory, mood and health, and shortchanging it hurts learning.','Students who cut sleep to study.','Readers who want strictly cautious, hedged science.','Sleep helps the brain store what you learned and recover from the day. Regular, sufficient sleep supports focus and mood, while chronic shortage harms performance. Keep a steady schedule and a cool, dark room.',['Sleep and memory|Rest helps lock in what you studied.','Regular schedule|Going to bed and waking at similar times supports better sleep.','Protect the evening|Bright screens and late caffeine make it harder to fall asleep.','All-nighters backfire|Lost sleep reduces attention and recall.'],['Set a fixed bedtime and wake time for a week.','Stop screens 30 minutes before bed.','Skip late caffeine.'],'Critics say some claims are overstated or simplified, so treat specific numbers with caution.','Persuasive and useful, but read the strongest claims critically.'),
N('med','Meditations','Marcus Aurelius','Philosophy',180,4.5,5,'Intermediate','Focus on what is in your control, accept the rest, and act with calm and integrity.','Students under stress who want a steady mindset.','Readers looking for a structured argument; it is a personal journal.','These private notes of a Roman emperor remind him to stay calm, do his duty and accept what he cannot change. The ideas of Stoicism help you respond to events rather than react.',['Control what you can|Your thoughts and actions are yours; outcomes often are not.','Perspective|Remember how brief and small daily troubles are.','Do your duty|Act well now instead of waiting for ideal conditions.','Obstacles as practice|Difficulty is a chance to build character.'],['Before a stressful exam, list what is in your control.','Write one short reflection each evening.','Reframe one setback as practice.'],'Translations differ, the text repeats itself, and it was never meant as a guide.','Short passages to dip into. Worth keeping nearby.'),
N('wings','Wings of Fire','A. P. J. Abdul Kalam','Biography',1999,4.4,10,'Beginner','Humble beginnings, good teachers and steady effort can lead to a life of service and achievement.','Students seeking inspiration and career direction.','Readers wanting an analytical, critical biography.','Kalam describes growing up in a modest family, learning from teachers who believed in him, and working in India’s space and defence research. He stresses perseverance after setbacks and using talent to serve the nation.',['Teachers matter|Mentors can change what you think is possible.','Learn from setbacks|Failures are part of any big project.','Work with purpose|Contribute to something larger than yourself.','Dream and act|Vision needs steady, disciplined work.'],['Thank a teacher who helped you.','Write a goal and the first three steps.','Review one recent failure for lessons.'],'It is a personal, admiring account and not a critical history.','Inspiring and easy to read, especially for students.')

['The 7 Habits of Highly Effective People','Stephen R. Covey','Self-Improvement',1989,15,'Intermediate','Lasting effectiveness comes from character and principles first, and techniques second.',['Be proactive|Choose your response to events instead of reacting.','Begin with the end in mind|Decide what matters most, then let it guide daily choices.','Put first things first|Spend time on important work before merely urgent tasks.'],['Write a personal mission statement in one paragraph.','Each Sunday, plan your week around your top three priorities.'],'It is long and sometimes preachy, and some advice is general.','A thoughtful foundation for personal effectiveness.'],
['The Power of Habit','Charles Duhigg','Self-Improvement',2012,10,'Beginner','Habits follow a loop of cue, routine and reward, and once you see the loop you can change it.',['The habit loop|Spot the cue and reward behind a habit to change the routine.','Keystone habits|Some habits, like exercise, trigger positive changes elsewhere.','Belief matters|Habits stick better when supported by others and by belief.'],['Pick one bad habit and write down its cue and reward.','Swap in a new routine that gives a similar reward.'],'Some stories are oversimplified, and it offers fewer practical steps than later habit books.','An engaging introduction to how habits work.'],

['Peak','Anders Ericsson and Robert Pool','Learning & Education',2016,10,'Intermediate','Expert skill comes from deliberate practice, not just natural gift.',['Deliberate practice|Practise just beyond your comfort zone, with clear goals.','Feedback is essential|Get quick correction from a coach or test.','Mental representations|Experts build rich mental models that guide performance.'],['Set a specific, slightly harder goal for each practice session.','Ask a teacher to critique your work weekly.'],'The popular “10,000 hours” idea is often oversimplified, and the book discusses it at length.','A solid guide to practising smarter.'],

['Blue Ocean Strategy','W. Chan Kim and Renée Mauborgne','Business',2005,10,'Advanced','Instead of fighting rivals in crowded markets, create new space where competition is irrelevant.',['Red and blue oceans|Crowded markets are bloody; new markets are open water.','Value innovation|Raise buyer value while lowering costs.','Eliminate, reduce, raise, create|Rethink which features matter to customers.'],['List features in your market and mark which to cut or add.','Look at non-customers to find unmet needs.'],'Frameworks can feel abstract, and examples are chosen after the fact.','A good lens for strategy courses.'],
['The Innovator’s Dilemma','Clayton M. Christensen','Business',1997,15,'Advanced','Successful companies can fail by listening too closely to current customers while newer technologies grow.',['Disruptive technology|Simpler, cheaper products can start small and then overtake leaders.','Good management can mislead|Serving your best customers may hide new threats.','Small markets matter|New ideas often begin in markets too small for big firms.'],['Study a company that was disrupted and note the warning signs.','Look for overlooked customers in your own field.'],'It is dense and academic, and the theory has been debated.','Important for understanding why industries change.'],
['Rich Dad Poor Dad','Robert T. Kiyosaki','Money & Finance',1997,5,'Beginner','Learning how money works, and building assets, matters more than just earning a salary.',['Assets and liabilities|Assets put money in your pocket; liabilities take it out.','Financial literacy|Understanding money is a skill that can be learned.','Think beyond a paycheck|Build income sources that do not depend only on your job.'],['List your monthly spending and mark what is an asset or a liability.','Learn the basics of one investment type.'],'The stories are widely questioned, and the advice is vague and risky if followed blindly.','Good for sparking interest, but verify its claims.'],
['The Intelligent Investor','Benjamin Graham','Money & Finance',1949,15,'Advanced','Successful investing needs discipline, patience and protection against your own emotions.',['Mr. Market|Prices swing with mood; do not follow the crowd.','Margin of safety|Buy with a cushion against error.','Investor versus speculator|Know whether you are investing or gambling.'],['Write investment rules before you invest.','Avoid reacting to daily price changes.'],'It is dense, dated in places, and hard for beginners.','A classic for serious learners.'],
['The Millionaire Next Door','Thomas J. Stanley and William D. Danko','Money & Finance',1996,10,'Beginner','Many wealthy people build wealth through steady saving and modest living.',['Live below your means|Spending less than you earn builds capital.','Appearances mislead|Expensive things do not equal wealth.','Self-reliance|Many wealthy people focus on independence and planning.'],['Save a fixed percentage of every income you receive.','Wait 30 days before any non-essential big purchase.'],'The data is dated and based on US households.','Useful perspective on what wealth looks like.'],
['I Will Teach You to Be Rich','Ramit Sethi','Money & Finance',2009,10,'Beginner','Automate the basics, spend on what you love, and cut what you do not.',['Automate your money|Set up automatic savings and bill payments.','Conscious spending|Spend freely on priorities and cut the rest.','Start investing early|Time in the market helps more than perfect timing.'],['Automate a small monthly transfer to savings.','Review subscriptions and cancel unused ones.'],'It is aimed at US readers, and products and rules vary by country.','A practical, action-first money guide.'],
['The Richest Man in Babylon','George S. Clason','Money & Finance',1926,5,'Beginner','Simple money rules, told as parables, build wealth over time.',['Pay yourself first|Save a portion of every income before spending.','Make money work|Invest savings so they earn more.','Guard your savings|Avoid risky schemes and seek advice from experts.'],['Set aside a fixed share of your income each time you receive it.','Learn about a safe place to keep savings.'],'The style is old-fashioned, and the advice is general.','A short, easy introduction to saving.'],
['Influence','Robert B. Cialdini','Psychology',1984,10,'Intermediate','A handful of psychological principles explain why people say yes.',['Reciprocity|People feel obliged to return favors.','Social proof|We copy what others are doing.','Scarcity|Limited availability makes things seem more valuable.'],['Notice which principle a sales pitch is using.','Ask for commitments in small, clear steps.'],'It can read as a guide to persuasion tricks, so use the ideas ethically.','Valuable for understanding and resisting persuasion.'],
['Predictably Irrational','Dan Ariely','Psychology',2008,10,'Beginner','People make irrational choices in consistent, predictable ways.',['Relativity|We judge value by comparison, not in absolute terms.','The power of free|Free items distort our choices.','Social versus market norms|Money can change how people respond to requests.'],['Before buying, ask what you are comparing it to.','Check whether a “free” offer hides costs.'],'Some experiments use small samples, and later research has questioned certain results.','Entertaining and easy to apply to daily choices.'],
['Quiet','Susan Cain','Psychology',2012,10,'Beginner','Introverts have strengths that are often overlooked in a world that rewards talkativeness.',['Introversion is not shyness|Introverts recharge alone and focus deeply.','Solitude fuels creativity|Many ideas come from time alone.','Design for both|Schools and workplaces can make room for quieter people.'],['Schedule alone time before big social events.','Prepare in writing before group discussions.'],'The line between introversion and shyness is sometimes blurred.','Reassuring for introverts and useful for anyone leading them.'],
['Drive','Daniel H. Pink','Psychology',2009,5,'Beginner','Motivation comes more from autonomy, mastery and purpose than from rewards.',['Autonomy|People work better when they have choice.','Mastery|The urge to get better is a strong motivator.','Purpose|Work feels meaningful when it serves something larger.'],['Choose how you will tackle one study task.','Set a small mastery goal for the week.'],'Some conclusions are simplified, and rewards still work for simple tasks.','A concise guide to motivation.'],
['Emotional Intelligence','Daniel Goleman','Psychology',1995,10,'Intermediate','Understanding and managing emotions matters as much as intelligence for success.',['Self-awareness|Notice your emotions as they arise.','Self-regulation|Pause before reacting.','Empathy|Read how others feel to respond well.'],['At the end of the day, name your main emotion and its cause.','Take three slow breaths before replying in a heated moment.'],'Early claims about its power were stated strongly, and the concept is broad.','An influential introduction to emotional skills.'],
['Crucial Conversations','Kerry Patterson et al.','Communication',2002,10,'Intermediate','The way you handle high-stakes talks shapes the results.',['Start with heart|Be clear about what you really want.','Make it safe|People stop listening when they feel threatened.','Stay in dialogue|Keep sharing facts and listening, even under pressure.'],['Before a hard talk, write your goal for the conversation.','State your intent so the other person feels safe.'],'Some tools feel formulaic.','Strong for group projects and tough discussions.'],
['Never Split the Difference','Chris Voss','Communication',2016,10,'Intermediate','Negotiation works best through listening, empathy and smart questions.',['Tactical empathy|Show you understand the other side’s view.','Mirroring and labeling|Repeat key words and name feelings.','Calibrated questions|Ask “how” and “what” questions that invite solutions.'],['Repeat the last few words someone says in your next conversation.','Ask “How am I supposed to do that?” instead of giving a flat no.'],'Examples come from hostage negotiation, so some tactics need adjusting for daily life.','Engaging and practical for negotiations.'],
['Nonviolent Communication','Marshall B. Rosenberg','Communication',1999,10,'Intermediate','Compassionate communication starts with observing, naming feelings and needs, and making clear requests.',['Observations, not judgments|Describe what happened without blame.','Feelings and needs|Say how you feel and what you need.','Make requests|Ask clearly for specific action.'],['Rewrite one complaint as an observation, a feeling, a need and a request.','Listen for the need behind someone’s words.'],'The structured phrasing can feel awkward at first.','A helpful framework for conflict.'],
['Made to Stick','Chip Heath and Dan Heath','Communication',2007,10,'Beginner','Ideas stick when they are simple, unexpected, concrete, credible, emotional and told as stories.',['Simple|Find the core of your message.','Unexpected|Surprise grabs attention.','Stories|Stories make ideas memorable and actionable.'],['Rewrite your next presentation point in one sentence.','Add a short story or example to a talk.'],'It is oriented to marketing and teaching and is not a script for every message.','Practical for presentations and writing.'],
['Difficult Conversations','Douglas Stone, Bruce Patton and Sheila Heen','Communication',1999,10,'Intermediate','Hard talks go better when you explore what happened, how you feel and what it says about you.',['Three conversations|Each talk covers facts, feelings and identity.','Shift to learning|Aim to understand, not to win.','Separate impact from intent|Do not assume the other person meant harm.'],['Describe the issue as a joint problem.','Ask what the other person sees that you may be missing.'],'It is long and some examples feel idealized.','Useful for conflict at home, school or work.'],
['Leaders Eat Last','Simon Sinek','Leadership',2014,10,'Beginner','Great leaders create safety so people trust and look after one another.',['Circle of safety|Protect people so they can focus on outside threats.','Put people first|Care for your team before yourself.','Trust drives performance|People give more when they feel safe.'],['Ask a teammate what would help them do better work.','Share credit and take responsibility for mistakes.'],'It leans on biology metaphors that scientists consider simplified.','A people-first view of leadership.'],
['Extreme Ownership','Jocko Willink and Leif Babin','Leadership',2015,10,'Beginner','Leaders take full responsibility for outcomes, without blaming others.',['Own everything|Accept that failures reflect your leadership.','Simple plans|Clear, simple plans are easier to carry out.','Prioritize and execute|Focus on the most important problem first.'],['After a setback, write what you could have done differently.','Explain the “why” behind your decisions to your team.'],'Military examples do not fit every setting, and taking all blame can be unhelpful.','Direct and motivating.'],
['The Five Dysfunctions of a Team','Patrick Lencioni','Leadership',2002,5,'Beginner','Teams fail because of weak trust, fear of conflict, low commitment, no accountability and ignored results.',['Trust is the base|Teams must be open about mistakes.','Healthy conflict|Debate ideas without personal attacks.','Accountability|Peers hold each other to standards.'],['Ask your group where trust is weakest.','Agree on clear goals and who owns what.'],'The model is presented as a fable, and its evidence is mostly anecdotal.','A quick, readable team guide.'],
['Radical Candor','Kim Scott','Leadership',2017,10,'Intermediate','Good managers care personally and challenge directly.',['Care personally|Build real relationships with people.','Challenge directly|Give honest, kind feedback.','Avoid ruinous empathy|Being nice but vague helps no one.'],['Give one piece of specific, kind feedback this week.','Ask for feedback on how you can improve.'],'The framework is easy to misuse as an excuse for harshness.','Helpful for building a feedback culture.'],
['Dare to Lead','Brené Brown','Leadership',2018,10,'Intermediate','Brave leaders are willing to be vulnerable, have hard conversations and show up with courage.',['Vulnerability is courage|Admitting uncertainty builds trust.','Rumble with hard topics|Talk openly about tough issues.','Clear values|Know your values and live by them.'],['Name your top two values and one way to act on them.','Admit one thing you do not know in your next meeting.'],'It is based on interviews and not on controlled research.','Inspiring for leading with honesty.'],
['The Pragmatic Programmer','Andrew Hunt and David Thomas','Technology & AI',1999,10,'Intermediate','Good programmers care about craft, take responsibility and keep learning.',['Don’t repeat yourself|Keep each piece of knowledge in one place.','Care about your craft|Take pride in quality.','Keep learning|Invest in your skills regularly.'],['Find duplicated code in your project and merge it.','Learn one new tool or language each year.'],'Some tools mentioned are dated.','A practical guide to professional habits.'],
['Life 3.0','Max Tegmark','Technology & AI',2017,15,'Intermediate','Advanced AI could reshape society, so we should decide what future we want.',['Three life stages|Life can evolve its software and even its hardware.','Goals and values|AI should be aligned with human aims.','Prepare now|Discuss jobs, safety and ethics early.'],['Read about one AI safety question and form an opinion.','Discuss how AI might change your field.'],'Some chapters are speculative about the far future.','Thought-provoking for beginners to AI.'],
['Superintelligence','Nick Bostrom','Technology & AI',2014,15,'Advanced','If machines exceed human intelligence, controlling their goals becomes a major challenge.',['The control problem|It is hard to ensure advanced AI does what we intend.','Different paths|Superintelligence could arise in several ways.','Plan early|Safety work must start before it is needed.'],['Look up what AI alignment research involves.','Write a short note on risks and benefits of advanced AI.'],'It is dense and speculative, and experts disagree on timelines and risks.','Influential but demanding.'],
['Artificial Intelligence: A Modern Approach','Stuart Russell and Peter Norvig','Technology & AI',1995,15,'Advanced','AI is the study of building agents that act well in their environment.',['Intelligent agents|Frame AI as agents that perceive and act.','Search and reasoning|Find good actions through search and logic.','Learning and uncertainty|Use probability and data to decide.'],['Pick one topic such as search and build a small example.','Work through the exercises for one topic each week.'],'It is a large university textbook, not a casual read.','The standard AI textbook; use it as a reference.'],
['Designing Data-Intensive Applications','Martin Kleppmann','Technology & AI',2017,15,'Advanced','Reliable data systems depend on understanding trade-offs in storage, replication and processing.',['Reliability, scalability, maintainability|Three goals guide system design.','Data models and storage|Pick structures that suit your queries.','Distributed trade-offs|Replication and consistency have costs.'],['Sketch how a simple app would store and read its data.','Read about one database you use and how it replicates.'],'It assumes some prior programming and systems knowledge.','Excellent for software engineering students.'],
['Spark','John J. Ratey','Health & Wellness',2008,10,'Beginner','Regular exercise supports mood, focus and learning.',['Exercise and the brain|Physical activity supports brain function.','Mood and stress|Movement can ease stress and low mood.','Learning|Active students tend to focus better.'],['Take a brisk 20-minute walk before studying.','Add a short workout to your week.'],'Some claims are based on early or small studies.','A motivating case for moving more.'],
['Burnout','Emily Nagoski and Amelia Nagoski','Health & Wellness',2019,10,'Beginner','Stress and the cycle that handles it are separate, and you need to complete the cycle.',['Complete the stress cycle|Movement, breathing, connection and rest help release stress.','Human giver syndrome|Constant self-sacrifice leads to burnout.','Rest and support|Meaningful rest and social connection matter.'],['Add 20 minutes of movement to your day.','Talk with a trusted friend after a stressful day.'],'It is not a substitute for professional help when stress is severe.','Practical and compassionate.'],
['Wherever You Go, There You Are','Jon Kabat-Zinn','Health & Wellness',1994,10,'Beginner','Mindfulness means paying attention to the present moment without judgment.',['Be here now|Return attention to the present.','Non-judging|Observe thoughts without criticizing yourself.','Daily practice|Short, regular practice builds the skill.'],['Try five minutes of mindful breathing each day.','Eat one meal without screens.'],'It is gentle and repetitive, with little structure.','A calm introduction to mindfulness.'],
['Breath','James Nestor','Health & Wellness',2020,10,'Beginner','How we breathe affects our health, and many people breathe poorly.',['Nasal breathing|Breathing through the nose may help filter and moisten air.','Slow breathing|Slower breaths can calm the body.','Posture and habit|Poor breathing habits can build over time.'],['Practise slow breathing for two minutes before studying.','Notice if you breathe through your mouth during the day.'],'Some claims are not well supported by research, so treat it cautiously.','Interesting, but verify the strongest claims.'],
['Peak Performance','Brad Stulberg and Steve Magness','Health & Wellness',2017,10,'Intermediate','Growth comes from the right mix of stress and rest.',['Stress plus rest equals growth|Pushing and recovering together improves performance.','Purpose|A clear reason keeps effort going.','Routines|Rituals help you start and focus.'],['Plan rest days and breaks as seriously as study blocks.','Create a short routine to start work.'],'It draws on sport and may not fit every field.','A balanced guide to sustainable performance.'],
['Man’s Search for Meaning','Viktor E. Frankl','Philosophy',1946,10,'Intermediate','Even in suffering, people can find meaning and choose their attitude.',['Search for meaning|A sense of purpose helps people endure hardship.','Freedom of attitude|We cannot always choose events but can choose our response.','Responsibility|Meaning comes from work, love and facing suffering with dignity.'],['Write what gives your life meaning.','Choose one challenge and decide how you will respond.'],'It is brief, and its second part gives only an outline of Frankl’s therapy.','A deeply moving and widely recommended classic.'],
['The Art of Happiness','Dalai Lama and Howard C. Cutler','Philosophy',1998,10,'Beginner','Happiness can be trained through mindset, compassion and daily practice.',['Training the mind|Attitudes can be changed through effort.','Compassion|Caring for others increases wellbeing.','Handling suffering|Accept pain and respond with perspective.'],['Do one small act of kindness today.','Reflect each evening on one thing you are grateful for.'],'It is gentle and conversational and gives few concrete steps.','Calming and thoughtful.'],
['Letters from a Stoic','Seneca','Philosophy',65,10,'Intermediate','Seneca urges us to use time well, face loss calmly and practise virtue.',['Use your time|Life is long enough if you do not waste it.','Prepare for hardship|Imagining setbacks reduces fear.','Virtue matters most|Character is the real good.'],['Track how you spend your time for a week.','Rehearse a setback calmly in your mind.'],'Translations vary and the letters can be repetitive.','Timeless advice, best read a few letters at a time.'],
['The Obstacle Is the Way','Ryan Holiday','Philosophy',2014,5,'Beginner','Obstacles can become fuel when we respond with perception, action and will.',['Perception|See problems clearly and without panic.','Action|Do what is within your power.','Will|Accept what you cannot change.'],['Write one current obstacle and one action you can take.','Reframe a setback as a chance to learn.'],'It leans on short anecdotes and is light on rigor.','Quick and motivating.'],
['Sophie’s World','Jostein Gaarder','Philosophy',1991,15,'Beginner','A novel that introduces the history of Western philosophy through letters to a teenage girl.',['Ask big questions|Philosophy begins with wonder.','A story of ideas|Thinkers from ancient Greece onward are introduced in order.','Think for yourself|Compare views and form your own.'],['Pick one philosopher and write what you agree and disagree with.','Ask a “why” question about something you take for granted.'],'It simplifies many ideas, and the plot can feel gimmicky.','A friendly introduction to philosophy.'],
['Steve Jobs','Walter Isaacson','Biography',2011,15,'Intermediate','The life of Apple’s co-founder shows how obsessive focus and taste shaped products, along with real flaws.',['Focus|Saying no to many things made great products possible.','Design and technology|He joined art and engineering.','A difficult style|His demanding approach brought results and costs.'],['Notice how you could simplify one project to its essentials.','Ask which details of your work deserve extra care.'],'It is long, and as an authorized biography it relies on Jobs’s own cooperation.','Informative, with lessons and cautions.'],
['Long Walk to Freedom','Nelson Mandela','Biography',1994,15,'Intermediate','Mandela recounts his journey from rural South Africa to prison and the presidency, and his fight against apartheid.',['Persistence|He kept pursuing justice through decades of struggle.','Forgiveness|He chose reconciliation over revenge.','Leadership by example|Dignity and discipline earned respect.'],['Read about one moment of resistance and what it required.','Think about a conflict where understanding could help.'],'It is long and told from Mandela’s own perspective.','A powerful story of courage.'],
['The Story of My Experiments with Truth','Mohandas K. Gandhi','Biography',1927,15,'Intermediate','Gandhi describes his life as a series of experiments in truth, self-discipline and nonviolence.',['Truth as a goal|He tested ideas against his conscience.','Self-discipline|He practised simplicity and control.','Nonviolence|He used peaceful resistance to seek change.'],['Keep a journal for two weeks and note where you acted on your values.','Try one small self-discipline practice for a week.'],'It covers his life only up to the early 1920s and is a personal account.','Reflective and historically important.'],
['Shoe Dog','Phil Knight','Biography',2016,10,'Beginner','The Nike co-founder tells the story of building a company from a small shoe-importing business.',['Persistence through risk|The early years were full of cash trouble.','Team and loyalty|Early colleagues shaped the company.','Believe in the product|He was driven by love of running and shoes.'],['Write down a risk you are avoiding and a small way to test it.','Thank someone who helped your progress.'],'It is one person’s account, so other views of the story are missing.','Honest and fun.'],
['Educated','Tara Westover','Biography',2018,10,'Intermediate','A memoir of growing up without formal schooling and finding education as a path to a new life.',['Education changes lives|Learning opened new views of herself and the world.','Self-belief|She learned to trust her own mind.','The cost of change|Growth can strain family ties.'],['Think about what education means to you.','Read one book outside your comfort area.'],'It deals with difficult family themes and is one person’s account.','Moving and well written.'],

// Home: hero, daily idea, continue reading, recommended, trending
function homeH(){
 const d=Math.floor(Date.now()/864e5),k=B[d%B.length],i=k.ideas[d%k.ideas.length];
 const last=$b(L('sn-last')),rd=new Set([...saved,...Object.keys(done)]),cs=new Set([...rd].map(id=>$b(id)&&$b(id).c));
 const rec=B.filter(x=>!rd.has(x.id)&&(!cs.size||cs.has(x.c))).sort((a,c)=>c.r-a.r).slice(0,4);

 return `<section class="hero"><div><h1>The key ideas of great books, in five minutes.</h1><p>Original summaries of ${B.length} books across 12 categories, written for students. Each tells you who it suits, where it falls short, and what to try this week.</p><form class="search" role="search" onsubmit="return false"><label class="sr" for="q">Search books</label><input id="q" type="search" placeholder="Search by title, author or topic" autocomplete="off"></form><div class="needs">${NEEDS.map(n=>`<button class="chip" data-n="${n[1]}">${n[0]}</button>`).join('')}</div></div><div class="feat"><div class="stage"><canvas id="cvH" role="img" aria-label="Rotating 3D books. Click a book to open its summary."></canvas></div><div class="hint">Scroll or move your mouse · click a book</div></div></section><div id="res"></div><div id="hb"><div class="blk"><div class="meta">Daily knowledge</div><h3>${i[0]}</h3><p>${i[1]}</p><button class="btn" data-id="${k.id}">From ${k.t}</button></div>${last&&!done[last.id]?`<h2 class="sec">Continue reading</h2><div class="grid">${card(last)}</div>`:''}<h2 class="sec">${rd.size?'Recommended for you':'Popular with students'}</h2>${grid(rec)}<h2 class="sec">Trending summaries</h2>${grid(tr)}</div>`}
// Explore: 12 category tiles, plus time and level filters

 const tiles=`<div class="tiles">${CATS.map(([c,t])=>`<button class="tile" data-c="${c}"><span class="serif">${c}</span><span class="meta">${t}</span><span class="meta">${B.filter(b=>b.c===c).length} summaries</span></button>`).join('')}</div>`;
 return `<h2 class="sec first">${cat||'Explore categories'}</h2>${cat?'<div class="row"><button class="btn" data-c="">All categories</button></div>':''}${fl}${cat||dur||lv?grid(B.filter(filt)):tiles}`}
// Discover: popular, new, editor's picks, short reads (change the lists here)

// My Library: reading goal, saved books, completed, history

// ---- SMOOTH SCROLL, 3D BOOKS AND ANIMATION (safe to leave alone) ----

let sy=scrollY,ty=scrollY,stop=null,fr=null,bgfr=null,lc=null;

const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.06}):null;

const RING=()=>['stick','habits','deep','money','think','friends'].map($b);
function wrap(g,s,x,y,mw,lh){let l='',ls=[];s.split(' ').forEach(w=>{const t=l?l+' '+w:w;if(g.measureText(t).width>mw&&l){ls.push(l);l=w}else l=t});ls.push(l);ls.forEach((z,i)=>g.fillText(z,x,y+i*lh))}
function tex(b){const c=document.createElement('canvas');c.width=512;c.height=768;const g=c.getContext('2d'),k=COV[B.indexOf(b)%8],f=b.t.length>28?54:b.t.length>16?70:86;
 g.fillStyle=k[0];g.fillRect(0,0,512,768);g.fillStyle=k[1];g.font='500 28px Inter,Arial,sans-serif';g.fillText(b.a.split(/,| and /)[0]+(/,| and /.test(b.a)?' et al.':''),64,84);

let mt=0;
function unmount(){mt++;if(stop){stop();stop=null}}
// Starts a 3D scene on a canvas (the ring on Home, the single book on a book page)
function mount(cv,books,mode){
 unmount();if(!cv)return;const tk=mt;
 Promise.race([document.fonts?document.fonts.ready:0,new Promise(r=>setTimeout(r,1200))]).then(()=>{if(tk===mt&&cv.isConnected)go()});
 function go(){
 try{
  if(!window.THREE)throw 0;

   if(ring){rc.setFromCamera(v,cam);const hit=rc.intersectObjects(g.children)[0];hov=hit?g.children.indexOf(hit.object):-1;cv.style.cursor=hit?'pointer':'default'}
   else if(drag){vy=(e.clientX-lx)*.012;ry+=vy;rx=Math.max(-.6,Math.min(.6,rx+(e.clientY-ly)*.01));lx=e.clientX;ly=e.clientY}});

   const now=performance.now(),e=REDUCE?1:ease(Math.min(1,(now-t0)/1500));

   if(ring){
    g.rotation.y=-(1-e)*2.6+(REDUCE?0:now/9000)+sy/innerHeight*1.6+mx*.6;g.rotation.x=my*.35;g.scale.setScalar(.66*(.45+.55*e));g.position.y=REDUCE?0:Math.sin(now/1500)*.1;
    g.children.forEach((m,i)=>{const a=i/n*Math.PI*2;m.userData.lz+=((hov===i?.7:0)-m.userData.lz)*.1;const r=3.4+m.userData.lz;m.position.set(Math.sin(a)*r,REDUCE?0:Math.sin(now/1100+i*1.3)*.14,Math.cos(a)*r)})}
   else{if(!drag){ry+=vy;vy+=((REDUCE?0:.006)-vy)*.03;rx+=(.1-rx)*.03}
    g.rotation.y=ry-(1-e)*3.2;g.rotation.x=rx;g.scale.setScalar(.7+.3*e);g.position.y=REDUCE?0:Math.sin(now/1200)*.08}
   R.render(sc,cam)};
  stop=()=>{fr=null;removeEventListener('pointerup',up);try{R.dispose();R.forceContextLoss()}catch(x){}};
 }catch(e){if(cv.parentNode)cv.parentNode.innerHTML=cover(books[0]);stop=null}
 }
